spring:
  application:
    name: Interview-Service
    version: 1.0.0
  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/interview_guide
    username: root
    password: 123456
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      url: redis://localhost:6379
      password: 123456
      database: 0
      timeout: 10 # 连接超时时间
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 2000ms
  sql:
    init:
      mode: always
      # 新环境统一从已合并的当前阶段脚本初始化；旧环境使用 sql/upgrade 下的模块升级脚本。
      schema-locations: classpath:sql/init.sql
      #data-locations:

  ai:
    vectorstore:
      pgvector:
        # 当前 PostgreSQL 14 镜像未安装 pgvector；Phase 7 启用向量检索时更换镜像后再开启。
        initialize-schema: false
    openai:
      api-key: ${API_KEY}
      base-url: https://ws-8erhtjf02it7xo3t.cn-beijing.maas.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-max

app:
  message:
    dispatch:
      # 调度线程只领取消息，业务 Handler 由有界线程池并行执行。
      high-delay-ms: 5000
      medium-delay-ms: 30000
      low-delay-ms: 300000
      lease-seconds: 300
      batch-size: 100
      worker-threads: 8
      # 默认不缓存已领取消息，避免任务排队期间租约过期。
      queue-capacity: 0
      shutdown-await-seconds: 30
  offer:
    # Offer 过期 Task 推进间隔。
    expiry-delay-ms: 60000
  storage:
    endpoint: http://localhost:9000    # RustFS 服务地址
    access-key: tJ4NevbNcFckxi4af8Uq   # 访问密钥（建议使用环境变量）
    secret-key: mvFgYqFJTvwH7FP5DZ8U96VPZYsYWImfhDugsaQM   # 私密密钥
    bucket: interview-guide            # 存储桶名称
    region: us-east-1                  # 区域（S3协议需要，可任意设置）

server:
  port: 8080

# mybatis-plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: interview.**.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false


springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  # TODO: 上线后需更换为极其复杂的随机字符串 且需存储到环境变量或密钥管理服务中
  secret: interview-guide-auth-secret-key-must-be-long-enough-32-chars-for-security
  # 单位: 分
  expiration: 30

security:
  # TODO: 上线后需更换为极其复杂的随机字符串 且需存储到环境变量或密钥管理服务中
  sm4Key: e14b2b2b1a9f5d3d3a4c5e6f7a8b9c0d
  aesKey: 8a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
  secret-cipher:
    # 新密文只使用 active-key-id；旧密钥继续保留在 keys 中用于解密和轮换。
    active-key-id: ${LLM_SECRET_ACTIVE_KEY_ID:v1}
    keys:
      v1: ${LLM_SECRET_KEY_V1:${security.aesKey}}
