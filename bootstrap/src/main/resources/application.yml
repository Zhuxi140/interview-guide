spring:
  application:
    name: Interview-Service
    version: 1.0.0
  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/interview_guide
    username: root
    password: 123456
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      url: redis://localhost:6379
      password: 123456
      database: 0
      timeout: 10 # 连接超时时间
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 2000ms
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/1/phase1-init.sql
      #data-locations:

  ai:
    openai:
      api-key: xx
      base-url: ddd

server:
  port: 8080

# mybatis-plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: interview.**.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false


springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  # TODO: 上线后需更换为极其复杂的随机字符串 且需存储到环境变量或密钥管理服务中
  secret: interview-guide-auth-secret-key-must-be-long-enough-32-chars-for-security
  # 单位: 分
  expiration: 30

security:
  # TODO: 上线后需更换为极其复杂的随机字符串 且需存储到环境变量或密钥管理服务中
  sm4Key: e14b2b2b1a9f5d3d3a4c5e6f7a8b9c0d
  aesKey: 8a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d