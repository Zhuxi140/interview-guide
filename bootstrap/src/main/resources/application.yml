spring:
  application:
    name: Interview-Service
    version: 1.0.0
  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/interview_guide
    username: root
    password: 123456
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/phase1-init.sql
      #data-locations:

  ai:
    openai:
      api-key: xx
      base-url: ddd

server:
  port: 8080

# mybatis-plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: interview.**.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  # TODO: 上线后需更换为极其复杂的随机字符串
  secret: interview-guide-auth-secret-key-must-be-long-enough-32-chars-for-security
  # 单位: 分
  expiration: 30
