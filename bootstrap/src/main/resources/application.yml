spring:
  application:
    name: Interview-Service
    version: 1.0.0
  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/interview_guide
    username: root
    password: 123456
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/phase1-init.sql
      #data-locations:

  ai:
    openai:
      api-key: xx
      base-url: ddd

server:
  port: 8080

# mybatis-plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.interview.modules.**.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

