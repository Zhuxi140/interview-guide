spring:
  ai:
    vectorstore:
      pgvector:
        # 当前 PostgreSQL 14 镜像未安装 pgvector；Phase 7 启用向量检索时更换镜像后再开启。
        initialize-schema: false
    openai:
      api-key: ${API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-max
  cache:
    cache-names:
        - llmSettings
    caffeine:
      spec: maximumSize=1000,expireAfterAccess=10m